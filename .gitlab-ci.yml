variables:
  NODE_COMPILE_IMAGE: 'node:24'

services:
  - docker:dind

stages:
  - build
  - publish

.assets:cache: &assets_cache
  key:
    files:
      - composer.lock
  paths:
    - src/Resources/public/
  policy: pull-push

build-job:
  stage: build
  image: ${NODE_COMPILE_IMAGE}
  variables:
    NODE_ENV: production
    npm_config_cache: $CI_PROJECT_DIR/.npm-cache
  before_script:
    - npm install
  script:
    - npx encore production
    - test -d src/Resources/public
  artifacts:
    when: on_success
    paths:
      - src/Resources/public/
    expire_in: 1 week
  cache:
    <<: *assets_cache

publish-job:
  stage: publish
  environment: production
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - 'curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" --data tag=dev-master "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/composer"'
  only:
    - master
  cache:
    <<: *assets_cache

publish-tag: # This job runs in the package stage.
  stage: publish
  environment: production
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache curl
    - 'curl --fail-with-body --header "Job-Token: $CI_JOB_TOKEN" --data tag=$CI_COMMIT_TAG "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/composer"'
  cache:
    <<: *assets_cache
